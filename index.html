<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Révision R3.05 Marketing</title>
<meta name="description" content="Préparation à l'examen R3.05 Stratégies de communication et marketing : théorie, lexique, entraînement et examens blancs QCM (FR / RU).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Unbounded:wght@500;600;700&display=swap">
<style>
/* R3.05 Révision : carnet de campagne.
   Idée de mise en page : une console d'analytics calme, papier sauge + encre indigo,
   la progression se lit comme des KPI ; les 4 chapitres ont chacun leur couleur. */
:root {
  --paper: #ECEFE8;
  --card: #F9FAF6;
  --card-2: #F1F3EC;
  --ink: #1B2320;
  --muted: #59635D;
  --line: #D3D9CE;
  --accent: #3A49A3;
  --accent-ink: #FFFFFF;
  --accent-soft: #E1E5F4;
  --ok: #2B7650;
  --ok-soft: #DCEEE2;
  --ko: #B13C36;
  --ko-soft: #F5DFDB;
  --flag: #A8751A;
  --flag-soft: #F3E8CF;
  --c1: #4F7488;
  --c2: #6650A8;
  --c3: #23807E;
  --c4: #BF5B36;
  --c5: #A2477A;
  --c6: #6E7F25;
  --c7: #8A5A3A;
  --grid: rgba(27, 35, 32, .045);
  --shadow: 0 1px 0 rgba(27,35,32,.04), 0 8px 24px -14px rgba(27,35,32,.25);
  --font-display: "Unbounded", "Segoe UI", system-ui, sans-serif;
  --font-body: "Golos Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --radius: 14px;
  --radius-s: 9px;
  --side: 248px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111513; --card: #191E1B; --card-2: #1F2521; --ink: #E3E8E2; --muted: #9AA59E; --line: #2D3530;
    --accent: #9BA7F2; --accent-ink: #12162B; --accent-soft: #252B48;
    --ok: #6CC596; --ok-soft: #1B3326; --ko: #EE8A80; --ko-soft: #3A2220; --flag: #E2B45C; --flag-soft: #352B17;
    --c1: #86AABD; --c2: #A895E6; --c3: #5CC2BE; --c4: #EB9673; --c5: #E28BBA; --c6: #B6C76A; --c7: #D4A07E;
    --grid: rgba(227, 232, 226, .035); --shadow: 0 1px 0 rgba(0,0,0,.3), 0 10px 28px -16px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111513; --card: #191E1B; --card-2: #1F2521; --ink: #E3E8E2; --muted: #9AA59E; --line: #2D3530;
  --accent: #9BA7F2; --accent-ink: #12162B; --accent-soft: #252B48;
  --ok: #6CC596; --ok-soft: #1B3326; --ko: #EE8A80; --ko-soft: #3A2220; --flag: #E2B45C; --flag-soft: #352B17;
  --c1: #86AABD; --c2: #A895E6; --c3: #5CC2BE; --c4: #EB9673; --c5: #E28BBA; --c6: #B6C76A; --c7: #D4A07E;
  --grid: rgba(227, 232, 226, .035); --shadow: 0 1px 0 rgba(0,0,0,.3), 0 10px 28px -16px rgba(0,0,0,.7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; height: 100%; }
html[data-size="l"] { font-size: 17.5px; }
html[data-size="xl"] { font-size: 19px; }
body {
  margin: 0; min-height: 100%;
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 1rem; line-height: 1.55;
}
h1, h2, h3, h4 { text-wrap: balance; margin: 0; }
h1, h2 { font-family: var(--font-display); font-weight: 600; letter-spacing: -.01em; }
h1 { font-size: clamp(1.6rem, 3.2vw, 2.3rem); line-height: 1.15; }
h2 { font-size: 1.3rem; line-height: 1.25; }
h3 { font-size: 1.08rem; font-weight: 650; }
h4 { font-size: .98rem; font-weight: 650; margin: 1.1rem 0 .4rem; }
p { margin: .5rem 0; }
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Shell ---------- */
.app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100vh; }
.side {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  display: flex; flex-direction: column; gap: 18px;
  padding: 22px 16px 18px; border-right: 1px solid var(--line);
  background: color-mix(in srgb, var(--card) 82%, transparent);
  backdrop-filter: blur(6px);
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.brand-mark { width: 38px; height: 38px; flex: none; }
.brand b { font-family: var(--font-display); font-weight: 600; font-size: 1.02rem; display: block; line-height: 1.1; }
.brand span { font-size: .78rem; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a {
  display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 10px;
  text-decoration: none; color: var(--ink); font-weight: 500;
}
.nav a svg { width: 19px; height: 19px; flex: none; opacity: .75; }
.nav a:hover { background: var(--card-2); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav a[aria-current="page"] svg { opacity: 1; }
.nav .count { margin-left: auto; font-family: var(--font-mono); font-size: .72rem; color: var(--muted); }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
.side-label { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 0 4px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--card-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; padding: 6px 4px; border-radius: 7px; font-size: .84rem; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.side-btns { display: flex; gap: 6px; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 7px 10px; font-size: .85rem; }
.icon-btn svg { width: 17px; height: 17px; }
.icon-btn:hover { border-color: var(--muted); }
.side-btns .icon-btn { flex: 1; }

.main { min-width: 0; padding: 30px clamp(16px, 4vw, 48px) 80px; }
.wrap { max-width: 1060px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.topbar { display: none; }
.bottom-nav { display: none; }

/* ---------- Generic components ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px; box-shadow: var(--shadow); }
.card.flat { box-shadow: none; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.eyebrow { font-family: var(--font-mono); font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--line); background: var(--card); color: var(--ink);
  padding: 10px 16px; border-radius: 11px; font-weight: 600; font-size: .95rem; text-decoration: none;
  transition: border-color .15s, background .15s, transform .1s;
}
.btn:hover { border-color: var(--muted); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--ko); border-color: color-mix(in srgb, var(--ko) 40%, var(--line)); }
.btn.danger.armed { background: var(--ko); color: #fff; border-color: var(--ko); }
.btn.small { padding: 6px 11px; font-size: .85rem; border-radius: 9px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn svg { width: 17px; height: 17px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; }
.row.between { justify-content: space-between; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--card);
  border-radius: 999px; padding: 6px 13px; font-size: .88rem; font-weight: 500;
}
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: .74rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--card-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.tag.ok { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
.tag.ko { color: var(--ko); background: var(--ko-soft); border-color: transparent; }
.tag.flag { color: var(--flag); background: var(--flag-soft); border-color: transparent; }
.tag.acc { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
.ch-dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.ch1 { --ch: var(--c1); } .ch2 { --ch: var(--c2); } .ch3 { --ch: var(--c3); } .ch4 { --ch: var(--c4); } .ch5 { --ch: var(--c5); } .ch6 { --ch: var(--c6); } .ch7 { --ch: var(--c7); }
.ch-dot, .chip .dot { background: var(--ch, var(--muted)); }
.empty { text-align: center; padding: 34px 16px; color: var(--muted); }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field .lbl { font-size: .82rem; font-weight: 600; color: var(--muted); }
.input { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 10px 12px; width: 100%; }
.input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.page-head { display: flex; flex-direction: column; gap: 6px; }
.page-head p { color: var(--muted); max-width: 64ch; margin: 0; }

/* ---------- Home ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; }
.hero-main { position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 14px; }
.hero-main .count { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.big-j { font-family: var(--font-display); font-weight: 700; font-size: clamp(3rem, 8vw, 4.6rem); line-height: .95; letter-spacing: -.03em; color: var(--accent); }
.hero-main .when { font-size: 1.05rem; font-weight: 600; }
.rules { display: flex; flex-wrap: wrap; gap: 8px; }
.rule { font-family: var(--font-mono); font-size: .82rem; padding: 6px 10px; border-radius: 8px; background: var(--card-2); border: 1px solid var(--line); }
.rule b { font-weight: 700; }
.rule.ok b { color: var(--ok); } .rule.ko b { color: var(--ko); }
.funnel { position: absolute; right: -24px; top: -18px; width: 170px; opacity: .08; pointer-events: none; color: var(--accent); z-index: 0; }
.hero-main > *:not(.funnel) { position: relative; z-index: 1; }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; box-shadow: var(--shadow); }
.kpi .val { font-family: var(--font-display); font-weight: 600; font-size: 1.65rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .lbl { font-size: .86rem; color: var(--muted); }
.kpi .spark { height: 6px; border-radius: 99px; background: var(--card-2); overflow: hidden; margin-top: 4px; }
.kpi .spark i { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
.chbars { display: flex; flex-direction: column; gap: 12px; }
.chbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; }
.chbar .name { display: flex; align-items: center; gap: 9px; font-weight: 550; min-width: 0; }
.chbar .name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chbar .stat { font-family: var(--font-mono); font-size: .8rem; color: var(--muted); }
.track { grid-column: 1 / -1; height: 9px; border-radius: 99px; background: var(--card-2); border: 1px solid var(--line); overflow: hidden; display: flex; }
.track i { display: block; height: 100%; }
.track .s-ok { background: var(--ch, var(--ok)); }
.track .s-ko { background: color-mix(in srgb, var(--ch, var(--ko)) 35%, transparent); }
.steps { counter-reset: st; display: flex; flex-direction: column; gap: 4px; margin: 0; padding: 0; list-style: none; }
.steps li { counter-increment: st; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 4px; border-bottom: 1px dashed var(--line); }
.steps li:last-child { border-bottom: 0; }
.steps li::before { content: counter(st); font-family: var(--font-mono); font-size: .8rem; font-weight: 700; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.steps li.done::before { content: "✓"; background: var(--ok-soft); color: var(--ok); }
.steps small { display: block; color: var(--muted); }
.ev { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.ev div { border: 1px solid var(--line); border-radius: 10px; padding: 10px; text-align: center; background: var(--card-2); }
.ev b { display: block; font-family: var(--font-mono); font-size: 1.05rem; }
.ev .neg { color: var(--ko); } .ev .zero { color: var(--muted); } .ev .pos { color: var(--ok); }
.ev span { font-size: .78rem; color: var(--muted); }

/* ---------- Theory ---------- */
.th-layout { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 22px; align-items: start; }
.toc { position: sticky; top: 20px; display: flex; flex-direction: column; gap: 3px; }
.toc a { display: flex; gap: 8px; align-items: flex-start; text-decoration: none; color: var(--ink); font-size: .88rem; padding: 6px 8px; border-radius: 8px; line-height: 1.35; }
.toc a:hover { background: var(--card); }
.toc a .ck { width: 15px; height: 15px; border-radius: 4px; border: 1.5px solid var(--line); flex: none; margin-top: 2px; display: grid; place-items: center; font-size: .65rem; }
.toc a.read .ck { background: var(--ok); border-color: var(--ok); color: #fff; }
.th-sections { display: flex; flex-direction: column; gap: 16px; }
.th-sec { scroll-margin-top: 20px; border-left: 4px solid var(--ch, var(--accent)); }
.th-sec .card-head h2 { font-size: 1.15rem; }
.th-body { max-width: 74ch; }
.th-body.both { max-width: none; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 26px; }
.th-body.both > div + div { border-left: 1px dashed var(--line); padding-left: 24px; }
.lang-flag { font-family: var(--font-mono); font-size: .7rem; font-weight: 700; color: var(--muted); letter-spacing: .1em; }
.th-body ul, .th-body ol { padding-left: 1.2rem; margin: .4rem 0; }
.th-body li { margin: .2rem 0; }
.th-body blockquote { margin: .8rem 0; padding: 12px 16px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 10px 10px 0; font-style: italic; }
.th-body blockquote cite { display: block; margin-top: 6px; font-style: normal; font-size: .82rem; color: var(--muted); }
.th-body .key { margin: .9rem 0 .3rem; padding: 11px 14px; border-radius: 10px; background: var(--flag-soft); border: 1px solid color-mix(in srgb, var(--flag) 30%, transparent); }
.th-body .key > b:first-child { display: block; font-family: var(--font-mono); font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--flag); margin-bottom: 2px; }
.th-body .ex { padding: 8px 12px; border-radius: 9px; background: var(--card-2); font-size: .93rem; }
.th-body .note { font-size: .88rem; color: var(--muted); }
.th-body .center { text-align: center; }
.comp { display: inline-block; font-family: var(--font-mono); font-size: .66rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--c2); background: color-mix(in srgb, var(--c2) 14%, transparent); padding: 1px 6px; border-radius: 5px; vertical-align: 2px; margin-right: 4px; }
.tbl-wrap { overflow-x: auto; margin: .5rem 0; }
.t { width: 100%; border-collapse: collapse; font-size: .92rem; }
.t th, .t td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.t th { font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 650; background: var(--card-2); }
.t td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 600; }
.t td.q { font-style: italic; white-space: nowrap; }
.t td.f { font-family: var(--font-mono); font-size: .84rem; }
.th-body .src { font-family: var(--font-mono); font-size: .76rem; color: var(--c5); margin: 0 0 .6rem; }
.chips-static { display: flex; flex-wrap: wrap; gap: 6px; margin: .5rem 0; }
.chips-static span { padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--card-2); font-size: .88rem; }
.t td.big { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; color: var(--accent); width: 46px; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
.th-body.both .cols { grid-template-columns: 1fr; gap: 4px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 22px; }
.th-body.both .grid2 { grid-template-columns: 1fr; }
ol.pills { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; counter-reset: p; }
ol.pills li { counter-increment: p; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--card-2); font-size: .9rem; }
ol.pills li::before { content: counter(p) "  "; font-family: var(--font-mono); color: var(--accent); font-weight: 700; }
ol.flow { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; counter-reset: f; }
ol.flow li { counter-increment: f; position: relative; padding: 8px 12px 8px 36px; border-radius: 10px; background: var(--card-2); border: 1px solid var(--line); font-size: .9rem; flex: 1 1 150px; }
ol.flow li::before { content: counter(f); position: absolute; left: 9px; top: 8px; width: 20px; height: 20px; border-radius: 6px; background: var(--ch, var(--accent)); color: #fff; font-family: var(--font-mono); font-size: .72rem; font-weight: 700; display: grid; place-items: center; }
ol.flow.small li { flex-basis: 120px; font-size: .85rem; }
.poem { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: .6rem 0; }
.th-body.both .poem { grid-template-columns: 1fr; }
.poem > div { border-radius: 12px; padding: 12px 14px; border: 1px solid var(--line); background: var(--card-2); border-top: 4px solid var(--pc); font-size: .9rem; }
.poem h4 { margin: 0 0 4px; } .poem h4 small { display: block; font-weight: 500; color: var(--muted); font-size: .78rem; }
.p-paid { --pc: var(--c4); } .p-owned { --pc: var(--c3); } .p-earned { --pc: var(--c2); }
.phases { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.th-body.both .phases { grid-template-columns: 1fr; }
.phases > div { border: 1px solid var(--line); border-radius: 12px; padding: 4px 14px 10px; background: var(--card-2); font-size: .92rem; }
.tiers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); margin-top: .8rem; }
.tiers div { padding: 12px; text-align: center; background: var(--card-2); }
.tiers div:nth-child(2) { background: color-mix(in srgb, var(--accent) 10%, var(--card-2)); }
.tiers div:nth-child(3) { background: color-mix(in srgb, var(--accent) 20%, var(--card-2)); }
.tiers b { display: block; font-family: var(--font-display); font-size: 1.5rem; color: var(--accent); }
.tiers span { font-size: .85rem; }

    {
      id: 'c1-ttm',
      title: { fr: 'Le Time to Market (TTM)', ru: 'Time to Market (TTM)' },
      fr: `
<p>Le <b>Time to Market (TTM)</b> est le temps écoulé entre <b>l'idée initiale</b> de conception d'un produit ou d'un service et son <b>lancement commercial effectif</b>, ainsi que le temps d'adoption par les utilisateurs.</p>
<p>C'est un <b>indicateur stratégique</b> : il mesure la <b>réactivité</b> et l'<b>efficacité opérationnelle</b> d'une entreprise pour transformer une innovation en revenus.</p>
<div class="key"><b>À retenir</b> TTM = de l'idée au lancement (et à l'adoption). Plus il est court, plus l'entreprise est réactive.</div>`,
      ru: `
<p><b>Time to Market (TTM)</b> - это время между <b>первоначальной идеей</b> продукта или услуги и его <b>реальным коммерческим запуском</b>, а также время, за которое пользователи его принимают.</p>
<p>Это <b>стратегический показатель</b>: он измеряет <b>скорость реакции</b> и <b>операционную эффективность</b> компании, то есть как быстро она превращает инновацию в доход.</p>
<div class="key"><b>Запомни</b> TTM = от идеи до запуска (и до принятия пользователями). Чем он короче, тем реактивнее компания.</div>`
    },
    {
      id: 'c1-usages',
      title: { fr: 'Les usages du digital dans le monde', ru: 'Использование digital в мире' },

<p>Chiffres mondiaux de <b>janvier 2024</b> :</p>
<table class="t"><thead><tr><th>Indicateur</th><th>Valeur</th></tr></thead><tbody>
<tr><td>Population mondiale</td><td class="num">8,08 milliards</td></tr>
<tr><td>Utilisateurs de smartphone</td><td class="num">5,61 milliards</td></tr>
<tr><td>Internautes</td><td class="num">5,35 milliards</td></tr>
<tr><td>Utilisateurs de réseaux sociaux</td><td class="num">5,04 milliards</td></tr>
</tbody></table>
<div class="key"><b>Astuce mémoire</b> Ordre décroissant : humains (8,08) &gt; smartphones (5,61) &gt; internet (5,35) &gt; réseaux sociaux (5,04). Il y a plus d'utilisateurs de smartphone que d'internautes.</div>`,
      ru: `
<p>Мировые цифры на <b>январь 2024</b>:</p>
<table class="t"><thead><tr><th>Показатель</th><th>Значение</th></tr></thead><tbody>

<tr><td>Пользователи смартфонов</td><td class="num">5,61 млрд</td></tr>

<div class="key"><b>Как запомнить</b> По убыванию: люди (8,08) &gt; смартфоны (5,61) &gt; интернет (5,35) &gt; соцсети (5,04). Пользователей смартфонов больше, чем пользователей интернета.</div>`

    {
      id: 'c1-ecom',
      title: { fr: 'Le marché du e-commerce', ru: 'Рынок e-commerce' },
      fr: `
<p><b>Le e-commerce</b> : toute transaction financière faite par le web.</p>
<h4>Chiffres clés (France)</h4>
<ul>
<li>Le e-commerce ne représente qu'<b>entre 10 et 12 %</b> du commerce total en France.</li>
<li>Environ <b>152 000 sites marchands actifs</b> sont répertoriés sur le <b>panel iCE PSP</b>.</li>
<li><b>+10 %</b> de sites marchands depuis <b>2022</b>.</li>
<li>8 Français sur 10 achètent en ligne pour <b>optimiser leurs achats</b> et gagner du temps.</li>
<li>Moyen de paiement le plus utilisé : la <b>carte bancaire (84 %)</b>. Le paiement en plusieurs fois se développe.</li>
<li>Mode de livraison le plus utilisé : <b>à domicile (77 %)</b>, puis <b>retrait en point relais (71 %)</b>.</li>
<li>Environ 40 millions de Français achètent en ligne, environ <b>60 achats par an</b> (panier d'environ 70 €), surtout les 15-45 ans et les professions supérieures.</li>
<li>Le plus acheté : les <b>vêtements</b>, puis les séjours, billets d'avion, voyages et divertissements.</li>
</ul>
<h4>La consommation omnicanale (omnicanalité)</h4>
<p>Le fait de pouvoir <b>tout acheter, partout, tout le temps</b>, à n'importe quel moment.</p>
<h4>Les motivations RSE</h4>
<p>Attention au <b>greenwashing</b>. Le <b>made in France</b> est important, ainsi que l'<b>économie circulaire</b> ou l'économie du partage. Le leader de l'économie circulaire est <b>Vinted</b>.</p>
<p>Les livraisons du e-commerce représentent une petite part (environ 0,5 % d'après les notes) du trafic routier dans les grandes agglomérations.</p>

<p>Le <b>persona</b> est un <b>nouveau mode de segmentation</b> basé sur la <b>connaissance client</b>.</p>
<p>La méthode des personas a été créée en <b>1999</b> par <b>Alan Cooper</b> : « Un persona est un <b>archétype</b> représentant un groupe de personnes dont les <b>comportements, motivations et buts</b> sont proches. »</p>
<p>Les personas sont utilisés en marketing et communication (<b>buyer personas</b>), mais aussi en design, ergonomie, informatique...</p>
<div class="key"><b>Règle</b> 1 persona = 1 produit / service.</div>
<p>Le marketing est passé d'une segmentation sur des <b>critères classiques</b> (âge, genre...) aux <b>personas</b>. Les personas permettent aux concepteurs de déterminer <b>ce que le produit ou service doit faire</b> et <b>comment il doit fonctionner</b>.</p>
<p class="ex">Exemple du cours : Michaël, trader (buts : aller vite, s'amuser) = voiture de sport ; Marie, mère de 2 enfants (être en sécurité, confortable) = monospace ; Paul, plombier (transporter des charges, fiabilité) = utilitaire.</p>
<h4>Utilité des buyer personas</h4>

<li><b>Communiquer et partager une vision commune</b> des utilisateurs (sites, applications, blogs...)</li>

<li><b>Aider à la prise de décision</b> dans la conception de la <b>stratégie POEM</b> : scénario, insight, canaux, médias, temporalité, message</li>
</ul>
<p>Concevoir une campagne avec des personas permet de <b>(re)centrer les discussions sur les humains</b> qui utiliseront le produit.</p>
<h4>Construire ses personas : 3 phases</h4>
<table class="t"><thead><tr><th>Phase</th><th>Contenu</th></tr></thead><tbody>
<tr><td><b>1. Recherche</b></td><td>Recueillir des informations sur les utilisateurs actuels ou futurs : qui ils sont, dans quelles <b>situations</b> ils utilisent le produit, leurs <b>buts</b>, <b>comportements</b>, <b>croyances et valeurs</b>, <b>expertises</b>, <b>freins</b>. Une liste de <b>100 questions</b> autour de <b>8 thèmes</b>.</td></tr>
<tr><td><b>2. Analyse</b></td><td>Identifier les <b>buts</b> et les <b>comportements</b> pour créer des <b>regroupements</b>. 3 étapes : (1) identification des <b>variables comportementales</b>, (2) <b>répartition des participants sur des échelles</b> (fréquence, importance...), (3) identification des <b>schémas comportementaux</b>.</td></tr>
<tr><td><b>3. Modélisation</b></td><td>Construire des modèles de comportement pour exprimer <b>conceptuellement et visuellement</b> des profils types. 3 étapes : (1) définition des <b>données de base</b> (civilité, photos...), (2) définition d'un <b>récit représentatif</b> du persona, (3) définition du <b>parcours client optimal</b>. Pour chaque groupe, on crée un personnage représentatif, la <b>buyer persona</b>, mis en forme dans une <b>fiche</b> appelée <b>CV marketing</b>.</td></tr>
</tbody></table>
<h4>Les 8 thèmes des 100 questions</h4>
<ol class="pills"><li>L'histoire</li><li>L'éducation</li><li>Le parcours professionnel</li><li>La situation personnelle</li><li>La situation financière</li><li>La vie privée</li><li>Réflexions, sentiments et motivations</li><li>Le raisonnement d'achat</li></ol>
<h4>Les 5 variables de Cooper (2004)</h4>
<table class="t"><tbody>
<tr><td><b>Activités</b></td><td>Ce que l'utilisateur fait, à quelle fréquence et dans quel volume</td></tr>
<tr><td><b>Attitudes</b></td><td>Ce que l'utilisateur pense du domaine du produit</td></tr>
<tr><td><b>Aptitudes</b></td><td>Sa formation et sa capacité d'apprentissage</td></tr>
<tr><td><b>Motivation</b></td><td>Pourquoi il est engagé dans le domaine du produit</td></tr>
<tr><td><b>Compétences</b></td><td>Ses capacités par rapport au domaine et aux technologies</td></tr>
</tbody></table>
<p class="ex">Exemple : pour un groupe « passionnés de BD », variables d'activité : achète des premières éditions, fait dédicacer ses BD, lit des BD, emprunte des BD, se renseigne avant d'acheter.</p>
<p>Une fiche persona contient par exemple : profil, centres d'intérêt, objectif, frustrations, personnalité.</p>`,
      ru: `
<p><b>Персона</b> - это <b>новый способ сегментации</b>, основанный на <b>знании клиента</b>.</p>
<p>Метод персон создал <b>Alan Cooper</b> в <b>1999</b> году: «Персона - это <b>архетип</b>, представляющий группу людей с похожими <b>поведением, мотивами и целями</b>».</p>
<p>Персоны используют в маркетинге и коммуникации (<b>buyer personas</b>), а также в дизайне, эргономике, IT...</p>
<div class="key"><b>Правило</b> 1 персона = 1 продукт / услуга.</div>
<p>Маркетинг перешёл от сегментации по <b>классическим критериям</b> (возраст, пол...) к <b>персонам</b>. Персоны помогают создателям определить, <b>что должен делать продукт или услуга</b> и <b>как он должен работать</b>.</p>
<p class="ex">Пример из курса: Michaël, трейдер (цели: скорость, удовольствие) = спорткар; Marie, мама двоих детей (безопасность, комфорт) = минивэн; Paul, сантехник (возить грузы, надёжность) = фургон.</p>
<h4>Зачем нужны buyer personas</h4>
<ul>
<li><b>Синтезировать</b> идеи из наблюдений и интервью с пользователями (онлайн и офлайн)</li>
<li><b>Передавать и разделять общее видение</b> пользователей (сайты, приложения, блоги...)</li>
<li><b>Вызывать эмоции и эмпатию</b> к пользователям, до которых трудно добраться</li>
<li><b>Помогать принимать решения</b> при разработке <b>стратегии POEM</b>: сценарий, insight, каналы, медиа, временные рамки, сообщение</li>
</ul>
<p>Кампания на основе персон позволяет <b>(снова) сосредоточить обсуждение на людях</b>, которые будут пользоваться продуктом.</p>
<h4>Как построить персоны: 3 фазы</h4>
<table class="t"><thead><tr><th>Фаза</th><th>Содержание</th></tr></thead><tbody>
<tr><td><b>1. Исследование (recherche)</b></td><td>Собрать информацию о текущих или будущих пользователях: кто они, в каких <b>ситуациях</b> пользуются продуктом, их <b>цели</b>, <b>поведение</b>, <b>убеждения и ценности</b>, <b>экспертиза</b>, <b>тормоза</b>. Список из <b>100 вопросов</b> по <b>8 темам</b>.</td></tr>
<tr><td><b>2. Анализ (analyse)</b></td><td>Определить <b>цели</b> и <b>поведение</b>, чтобы создать <b>группы</b>. 3 шага: (1) выявление <b>поведенческих переменных</b>, (2) <b>распределение участников по шкалам</b> (частота, важность...), (3) выявление <b>поведенческих паттернов</b> (schémas comportementaux).</td></tr>
<tr><td><b>3. Моделирование (modélisation)</b></td><td>Построить модели поведения, чтобы <b>концептуально и визуально</b> выразить типичные профили. 3 шага: (1) <b>базовые данные</b> (обращение, фото...), (2) <b>характерная история</b> персоны, (3) <b>оптимальный путь клиента</b>. Для каждой группы создают типичного персонажа, <b>buyer persona</b>, оформленного в <b>карточку</b>, которую называют <b>CV marketing</b>.</td></tr>
</tbody></table>
<h4>8 тем для 100 вопросов</h4>
<ol class="pills"><li>История</li><li>Образование</li><li>Профессиональный путь</li><li>Личная ситуация</li><li>Финансовая ситуация</li><li>Частная жизнь</li><li>Мысли, чувства и мотивы</li><li>Логика покупки</li></ol>
<h4>5 переменных Купера (2004)</h4>
<table class="t"><tbody>
<tr><td><b>Activités</b> (действия)</td><td>Что пользователь делает, как часто и в каком объёме</td></tr>
<tr><td><b>Attitudes</b> (отношение)</td><td>Что он думает о сфере продукта</td></tr>
<tr><td><b>Aptitudes</b> (способности)</td><td>Его образование и способность учиться</td></tr>
<tr><td><b>Motivation</b> (мотивация)</td><td>Почему он вовлечён в сферу продукта</td></tr>
<tr><td><b>Compétences</b> (компетенции)</td><td>Его умения в этой сфере и в технологиях</td></tr>
</tbody></table>
<p class="ex">Пример: для группы «любители комиксов» переменные действий: покупает первые издания, берёт автографы, читает комиксы, берёт их на время, изучает перед покупкой.</p>
<p>Карточка персоны содержит, например: профиль, интересы, цель, фрустрации, личность.</p>`

      fr: `
<div class="cols">
<div><h4>Outbound marketing</h4><p>L'entreprise va chercher le client <b>de force</b> : pub TV, spots radio, affiches, appels commerciaux, emails non sollicités. On <b>interrompt</b> les gens, même s'ils n'ont rien demandé. Cible tout le monde sans distinction.</p></div>
<div><h4>Inbound marketing</h4><p>C'est le <b>client qui vient vers l'entreprise</b>, attiré par du <b>contenu utile</b> (blog, vidéos, réseaux sociaux, SEO). L'entreprise accompagne petit à petit jusqu'à l'achat.</p></div>
</div>
<div class="key"><b>En résumé</b> outbound = on <b>interrompt</b> ; inbound = on <b>attire</b>.</div>
<h4>Les 4 étapes de l'inbound (stratégie pull)</h4>
<table class="t"><thead><tr><th>Étape</th><th>But</th><th>Exemple</th></tr></thead><tbody>
<tr><td><b>1. Attirer</b></td><td>Faire venir des visiteurs inconnus grâce à du contenu utile et pertinent</td><td>Article de blog qui répond à une question</td></tr>
<tr><td><b>2. Convertir</b></td><td>Transformer le visiteur anonyme en <b>prospect identifié</b> (email, nom) en échange d'un contenu à valeur ajoutée</td><td>Formulaire pour télécharger un guide gratuit</td></tr>
<tr><td><b>3. Conclure</b></td><td>Transformer le prospect en <b>client</b> : suivi personnalisé, relances, offres ciblées</td><td>Email automatisé avec démo ou réduction</td></tr>
<tr><td><b>4. Fidéliser</b></td><td>Continuer à offrir de la valeur pour qu'il rachète et <b>recommande</b> (ambassadeur)</td><td>Service client réactif, contenu exclusif, programme de fidélité</td></tr>
</tbody></table>
<p>Logique globale : un <b>entonnoir progressif</b>, de l'inconnu total jusqu'à l'<b>ambassadeur</b> de la marque.</p>
<div class="cols">
<div><h4>Stratégie pull (tirer)</h4><p>L'entreprise <b>crée l'envie</b> chez le consommateur final (pub, contenu, réputation, réseaux sociaux, bouche-à-oreille). Le client demande lui-même le produit en magasin : la demande « <b>tire</b> » le produit à travers la chaîne de distribution.</p><p class="ex">Ex. <b>Apple</b> : forte image de marque, les clients entrent en boutique en demandant précisément un iPhone.</p></div>
<div><h4>Stratégie push (pousser)</h4><p>L'entreprise <b>pousse activement</b> le produit vers le client : promotions en magasin, commissions aux vendeurs, mise en avant dans les rayons.</p></div>
</div>`,

<table class="t"><thead><tr><th>Этап</th><th>Цель</th><th>Пример</th></tr></thead><tbody>

      title: { fr: 'Les nouveaux modèles économiques du digital', ru: 'Новые бизнес-модели digital' },
      fr: `
<table class="t models"><thead><tr><th>Modèle</th><th>Principe</th><th>Exemple phare</th></tr></thead><tbody>
<tr><td><b>Plateforme d'intermédiation</b></td><td>Ne produit pas le bien ou le service : <b>met en relation</b> offreurs et demandeurs (<b>marché biface</b>), sans posséder les actifs. Repose sur l'<b>effet de réseau</b>.</td><td><b>BlaBlaCar</b> (Uber, Airbnb, Le Bon Coin)</td></tr>
<tr><td><b>Longue traîne</b></td><td>Stockage et distribution quasi gratuits en ligne : on propose une <b>infinité de produits de niche</b>. La somme des ventes de niche peut dépasser celle des best-sellers.</td><td><b>Netflix</b> (Amazon, Spotify, YouTube)</td></tr>
<tr><td><b>Abonnement</b></td><td>Paiement <b>récurrent</b> (mensuel, annuel) pour un <b>accès continu</b>. On vend une <b>relation durable</b>, pas un achat ponctuel.</td><td><b>Netflix</b> (Spotify, Amazon Prime, Adobe CC)</td></tr>
<tr><td><b>Commission</b></td><td>Met en relation vendeur et acheteur et prélève un <b>pourcentage sur chaque transaction</b>. Gagne uniquement quand une vente a lieu.</td><td><b>Airbnb</b> (BlaBlaCar, Uber, Booking)</td></tr>
<tr><td><b>E-pub (gratuit... vraiment ?)</b></td><td>Service gratuit pour l'utilisateur ; l'entreprise vend l'<b>attention et les données</b> aux <b>annonceurs</b> (le vrai client).</td><td><b>Google</b> (Facebook, YouTube)</td></tr>
<tr><td><b>Freemium</b></td><td><b>Free + premium</b> : version de base gratuite et illimitée dans le temps, version payante avec plus de fonctions.</td><td><b>Spotify</b> (LinkedIn, Canva, Dropbox)</td></tr>
<tr><td><b>Ventes privées</b></td><td>Produits de marque à <b>prix réduit</b>, <b>durée limitée</b>, réservés aux <b>membres inscrits</b>. Écoule les stocks sans abîmer l'image.</td><td><b>Veepee</b> (Showroomprivé, BrandAlley)</td></tr>
<tr><td><b>Économie circulaire</b></td><td>Contre le modèle linéaire « produire, consommer, jeter » : faire <b>durer</b> les produits (réutiliser, réparer, reconditionner, recycler).</td><td><b>Back Market</b> (Vinted, Decathlon occasion)</td></tr>

<h4>Les points à savoir par modèle</h4>
<ul>
<li><b>Plateforme</b> : <b>effet de réseau positif</b> (externalité de réseau) = chaque nouvel utilisateur augmente la valeur pour tous. Coûts faibles (pas de flotte, pas de chauffeurs salariés), croissance rapide, forte <b>barrière à l'entrée</b> une fois la <b>masse critique</b> atteinte. BlaBlaCar prend une commission par trajet.</li>

<li><b>Commission</b> : pas d'actifs, peu de coûts fixes, risque reporté sur le vendeur, intérêts alignés sur le <b>volume de transactions</b>. Airbnb prélève côté hôte et côté voyageur. Souvent combiné avec la plateforme d'intermédiation.</li>

<h4>Les 6 niveaux stratégiques</h4>
<table class="t"><tbody>
<tr><td class="big">1</td><td><b>Campagnes de masse</b> : message identique pour tous les contacts, aucune personnalisation. Rapide mais peu performant.</td></tr>
<tr><td class="big">2</td><td><b>Campagnes segmentées</b> : messages et fréquences différents selon l'interaction (ex. ceux qui n'ont jamais cliqué).</td></tr>
<tr><td class="big">3</td><td><b>Campagnes ciblées</b> : analyse des <b>liens cliqués</b> pour adapter les campagnes suivantes ; la personnalisation commence.</td></tr>
<tr><td class="big">4</td><td><b>Campagnes personnalisées</b> : centrées sur le contact (sexe, âge, zone, achats, intérêts, cycle de vie) avec des <b>encarts au contenu dynamique</b>.</td></tr>
<tr><td class="big">5</td><td><b>Campagnes multicanales</b> : la même information sur tous les points de contact (email desktop et smartphone, messagerie, RS, SMS, courrier, notifications).</td></tr>
<tr><td class="big">6</td><td><b>Campagnes interactives</b> : véritable <b>dialogue</b> avec le contact, qui donne son avis ; confiance et coopération, il devient <b>ambassadeur</b> (bouche-à-oreille positif).</td></tr>
</tbody></table>
<h4>Les 8 étapes de construction d'une campagne</h4>
<ol class="flow small">
<li><b>Définir l'objectif</b> (conquête, CA, fidélisation, garder le contact, annonces)</li>
<li><b>Segmenter et cibler</b> (enrichir et mettre à jour la base, listes)</li>
<li><b>Choisir la date d'envoi</b> (événements culturels, B2B ou B2C, heure propice)</li>
<li><b>Créer un contenu original</b> (pas de pavés, ratio <b>70/30</b> images / texte, message principal pas trop bas)</li>
<li><b>Utiliser un CTA efficace</b> (obligatoire, phrase percutante, couleur forte, pas trop bas)</li>
<li><b>Personnaliser le message</b> (objet qui suscite l'ouverture, moins de générique, relire)</li>
<li><b>Prévoir la désinscription</b> (obligation légale, lien en bas du mail)</li>
<li><b>Tracker et analyser</b> (tracking des liens, comparer les envois, calculer le ROI)</li>
</ol>`,

      fr: `
<div class="cols">
<div><h4>Opt-in : pas de « oui » = « non »</h4><p>Avant d'envoyer de la publicité par <b>mail, SMS, MMS ou fax</b>, il faut <b>obligatoirement obtenir le consentement</b> du destinataire (case à cocher « Si vous souhaitez recevoir... »). Amende administrative jusqu'à <b>375 000 €</b> pour une personne morale.</p></div>
<div><h4>Opt-out : pas de « non » = « oui »</h4><p>À défaut de <b>s'opposer</b>, la personne peut recevoir des publicités (« Si vous <b>ne</b> souhaitez <b>pas</b> recevoir... cochez »). Concerne la pub par <b>courrier postal</b>, par <b>téléphone</b>, et l'email pour des produits <b>similaires</b> à ceux déjà achetés chez ce professionnel.</p></div>
</div>
<h4>Le pixel de tracking</h4>
<p>Image <b>transparente d'un seul pixel</b> insérée de façon invisible dans un email ou une page web pour savoir si le message a été <b>ouvert</b>. Elle se charge depuis un serveur dès l'ouverture : l'expéditeur connaît l'<b>heure d'ouverture</b>, le <b>type d'appareil</b> et une <b>position estimée</b> via l'adresse IP. But : mesurer l'audience et nettoyer les listes. En France, la <b>CNIL</b> encadre ces traceurs et impose d'informer les destinataires (consentement, lien en bas du message).</p>
<h4>Bonnes pratiques</h4>
<ul class="grid2">
<li>Nom d'expéditeur clair</li><li>Objet clair, instructif et incitatif</li>
<li>Pas de MAJUSCULES ni de points d'exclamation dans l'objet (classés en spam)</li><li>Personnaliser le contenu et l'offre</li>
<li>Rester concis, encourager à agir</li><li>Landing pages dédiées, optimisées pour la conversion</li>
<li>Bannir les fautes d'orthographe</li><li>Utiliser une plateforme d'emailing</li>
</ul>
<p><b>Objet</b> : les meilleurs taux d'ouverture (60-87 %) ont un objet du type « [NOM DE L'ENTREPRISE] Newsletter » ; les pires (1-14 %) sont des objets promotionnels (« Valentines - Shop Early & Save 10% »).</p>
<div class="cols">
<div><h4>Mots à éviter</h4><p>Acheter, commander, s'abonner, s'inscrire, donner, remplir, compléter</p></div>
<div><h4>Mots à utiliser</h4><p>Découvrir, obtenir, gagner, révéler, apprendre, se former, utiliser</p></div>
</div>
<h4>Ergonomie : les 5 règles d'or</h4>
<ol><li>Couleurs contrastées</li><li>Typographie lisible</li><li>De l'espace blanc, un email aéré</li><li>Une composition en <b>S</b></li><li>Les boutons d'incitation à l'action (CTA) <b>en haut</b></li></ol>
<p>Structure : <b>éléments principaux figés</b> en haut (baseline) puis <b>éléments secondaires scrollables</b>.</p>
<p><b>Plateformes</b> : Mailjet (démo en cours), Mailchimp, Sarbacane, Experian, Smart Focus, Message Business, SendBlaster, Mail Performance.</p>`,
      ru: `
<div class="cols">
<div><h4>Opt-in: нет «да» = «нет»</h4><p>Прежде чем отправлять рекламу по <b>email, SMS, MMS или факсу</b>, нужно <b>обязательно получить согласие</b> получателя (галочка «Если вы хотите получать...»). Штраф до <b>375 000 €</b> для юрлица.</p></div>
<div><h4>Opt-out: нет «нет» = «да»</h4><p>Если человек <b>не возразил</b>, ему можно присылать рекламу («Если вы <b>не</b> хотите получать... отметьте»). Касается рекламы <b>по почте</b>, <b>по телефону</b> и email о <b>похожих</b> товарах, уже купленных у этого продавца.</p></div>
</div>
<h4>Пиксель отслеживания (pixel de tracking)</h4>
<p><b>Прозрачная картинка в один пиксель</b>, невидимо вставленная в письмо или страницу, чтобы узнать, <b>открыто</b> ли сообщение. Она загружается с сервера при открытии: отправитель узнаёт <b>время открытия</b>, <b>тип устройства</b> и <b>примерное местоположение</b> по IP. Цель: измерить аудиторию и чистить базы. Во Франции <b>CNIL</b> регулирует такие трекеры и требует информировать получателей (согласие, ссылка внизу письма).</p>
<h4>Хорошие практики</h4>
<ul class="grid2">
<li>Понятное имя отправителя</li><li>Ясная, информативная и побуждающая тема</li>
<li>Без ЗАГЛАВНЫХ и восклицательных знаков в теме (уходит в спам)</li><li>Персонализировать контент и предложение</li>
<li>Кратко, побуждать к действию</li><li>Отдельные landing pages, оптимизированные под конверсию</li>
<li>Без орфографических ошибок</li><li>Использовать платформу рассылок</li>
</ul>
<p><b>Тема письма</b>: лучшая открываемость (60-87 %) у тем вида «[НАЗВАНИЕ КОМПАНИИ] Newsletter»; худшая (1-14 %) у промо-тем («Valentines - Shop Early & Save 10%»).</p>
<div class="cols">
<div><h4>Слова, которых избегать</h4><p>Acheter, commander, s'abonner, s'inscrire, donner, remplir, compléter (купить, заказать, подписаться, записаться, дать, заполнить, дополнить)</p></div>
<div><h4>Слова, которые использовать</h4><p>Découvrir, obtenir, gagner, révéler, apprendre, se former, utiliser (открыть для себя, получить, выиграть, раскрыть, узнать, обучиться, использовать)</p></div>
</div>
<h4>Эргономика: 5 золотых правил</h4>
<ol><li>Контрастные цвета</li><li>Читаемый шрифт</li><li>Белое пространство, «воздух»</li><li>Композиция в форме <b>S</b></li><li>Кнопки призыва к действию (CTA) <b>вверху</b></li></ol>
<p>Структура: <b>главные элементы зафиксированы</b> вверху (baseline), затем <b>второстепенные, которые прокручивают</b>.</p>
<p><b>Платформы</b>: Mailjet (демо на занятии), Mailchimp, Sarbacane, Experian, Smart Focus, Message Business, SendBlaster, Mail Performance.</p>`

      fr: `

<p>3 modes de rémunération : <b>CPC</b> (clic sur l'offre ou la bannière), <b>CPL</b> (un lead : contact, newsletter, formulaire, devis), <b>CPA</b> (une action précise, le plus souvent un <b>achat</b>).</p>

<h4>Le retargeting (remarketing, reciblage publicitaire)</h4>
<p>Technique qui cible les <b>visiteurs d'un site</b> (qui ont donc <b>déjà montré de l'intérêt</b>) avec une campagne display, emailing ou réseaux sociaux.</p>

<p>Plateformes : <b>Criteo</b>, Google Ads, Meta Business Partner, AppNexus, DoubleClick Campaign Manager.</p>`,

  /* ---------- Entraînement ---------- */
  function practicePool(cfg) {
    return QUESTIONS.filter(function (q) {
      if (cfg.chs.indexOf(q.ch) < 0) return false;
      var p = S.prog[q.id];

  }
  function startPractice(cfg) {

  function viewPractice() {

        '<button class="btn primary" data-act="pr-start" data-key="prstart" ' + (avail ? '' : 'disabled') + '>' + t('start') + icon('right') + '</button></div>' +
      '</div>' +
      '<div class="row end">' + resetBtn('practice', t('practice_reset')) + '</div>';
  }
  function practiceRunner(P) {
    var id = P.ids[P.i]; var q = QMAP[id]; var pm = perm('p' + P.sd, id);
    var answered = Object.prototype.hasOwnProperty.call(P.ans, id); var my = P.ans[id];
    var ok = 0, ko = 0, sk = 0;
    Object.keys(P.ans).forEach(function (k) { var a = P.ans[k]; if (a === -1) sk++; else if (a === QMAP[k].a) ok++; else ko++; });
    var opts = pm.map(function (orig, pos) {
      var o = q.o[orig]; var cls = 'opt'; var mark = '';

      var rightPos = pm.indexOf(q.a);

      '<div class="scoreline"><span class="tag ok">+' + ok + '</span><span class="tag ko">-' + ko + '</span><span class="tag">0 × ' + sk + '</span><span class="tag acc">' + t('net') + ' ' + sign(ok - ko) + '</span></div></div>' +
      '<article class="card qcard" id="qcard"><div class="qmeta">' + chTag(q.ch) + (q.x ? '<span class="tag">' + t('comp') + '</span>' : '') + '<span style="margin-left:auto"></span>' + peekBtn(id) + '</div>' +
      qTextHtml(q, id) + '<ul class="opts">' + opts + '</ul>' + fb +

      '<div class="kbd-hint"><span><kbd>1</kbd>-<kbd>4</kbd> ' + t('kb_choose') + '</span><span><kbd>0</kbd> ' + t('kb_skip') + '</span><span><kbd>' + t('k_enter') + '</kbd> ' + t('kb_next') + '</span>' + (S.lang !== 'both' ? '<span><kbd>T</kbd> ' + t('kb_tr') + '</span>' : '') + '</div>';

  function practiceSummary(P) {

  function reviewItem(q, my, seed, flaggedMark) {

  /* ---------- Examens ---------- */
  function examTitle(eid) { var n = +eid.slice(1); return n <= NFIXED ? t('exam_n') + ' ' + n : t('exam_rand'); }

  function bestOf(eid) { var b = null; S.history.forEach(function (h) { if (h.eid === eid && (b === null || h.net > b)) b = h.net; }); return b; }
  function startExam(eid) {
    var prev = S.exams[eid]; var attempt = (prev && prev.attempt ? prev.attempt : 0) + 1;
    var base = eid === 'e5' ? randomExamIds() : EXAM_SETS[+eid.slice(1) - 1];

  function viewExams() {

  function examRunner(eid, ex) {
